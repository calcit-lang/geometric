name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: "enable Yarn"
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"

    - name: "install modules"
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: "validate Calcit"
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        git diff --exit-code --quiet -- calcit.cirru
        calcit calcit.cirru --check-only --all-defs --format json
        calcit calcit.cirru --check-only --ns geometric.core --summary-only --format json
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
        calcit calcit.cirru test --require-match
        calcit calcit.cirru

    - name: "test JavaScript"
      run: |
        set -euo pipefail
        calcit calcit.cirru js
        node ./main.mjs
