name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: 20
        package-manager-cache: false

    - name: "enable Yarn"
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate

    - uses: calcit-lang/setup-calcit@v1

    - name: "install modules"
      run: caps --strict --ci

    - name: "validate Calcit"
      run: |
        test "$(calcit -v)" = "0.13.77"
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru --warn-dyn-method --check-only
        calcit calcit.cirru analyze check-types --summary-only --format json
        calcit calcit.cirru analyze weak-types --only schema-dynamic,unresolved-type-slot,code-dynamic --intent unresolved --summary-only --format json
        calcit calcit.cirru analyze deprecated --summary-only --format json
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru --format json
        calcit calcit.cirru

    - name: "test JavaScript"
      run: |
        calcit calcit.cirru js
        yarn install --immutable
        node ./main.mjs
