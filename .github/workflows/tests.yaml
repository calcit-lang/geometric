name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: "enable Yarn"
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        calcit-version: "0.28.0"
        caps-version: "0.1.1"

    - name: "install modules"
      run: |
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: "validate Calcit"
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --strict-types --warn-dyn-method --check-only
        calcit calcit.cirru analyze check-public --ns geometric.core --ns geometric.test --summary-only --format json
        calcit docs format-md README.md --check
        calcit docs check-md README.md
        calcit calcit.cirru test --require-match
        calcit calcit.cirru --strict-types --warn-dyn-method

    - name: "test JavaScript"
      run: |
        calcit calcit.cirru js
        node ./main.mjs
